upstream airml {
    server airml:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Increase body size limit for embeddings batches (up to 10 MB).
    client_max_body_size 10m;

    # Pass Authorization header through to airml (Bearer token support).
    proxy_pass_header Authorization;

    location / {
        proxy_pass         http://airml;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass the Authorization header so API key auth works end-to-end.
        proxy_set_header   Authorization     $http_authorization;

        # Timeouts generous enough for large batch embedding calls.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    30s;
    }

    # Health check endpoint — nginx responds without hitting airml.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
