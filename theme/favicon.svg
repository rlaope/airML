<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    airML favicon — simplified chevron mark, legible at 16x16.
    Single color via currentColor.
  -->
  <g fill="currentColor">
    <!-- Left leg -->
    <polygon points="2,26 8,26 16,8 10,8" />
    <!-- Right leg -->
    <polygon points="16,8 22,8 22,14 16,14" />
    <!-- Top cap -->
    <polygon points="10,8 16,8 16,14 12,22 6,22" />
  </g>
</svg>
