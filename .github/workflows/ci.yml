name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Matrix: check + clippy + test across OS × feature combinations ─────────
  test:
    name: test (${{ matrix.os }}, features=${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        features: ["", "coreml", "coreml,nlp"]
        exclude:
          # coreml is Apple-only; skip those cells on Ubuntu
          - os: ubuntu-22.04
            features: "coreml"
          - os: ubuntu-22.04
            features: "coreml,nlp"

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check --workspace --all-targets
          else
            cargo check --workspace --all-targets --features=${{ matrix.features }}
          fi

      - name: cargo clippy
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            cargo clippy --workspace --all-targets --features=${{ matrix.features }} -- -D warnings
          fi

      - name: cargo test
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --workspace
          else
            cargo test --workspace --features=${{ matrix.features }}
          fi

  # ── Bench compile: ensure criterion harness compiles (macOS only) ──────────
  bench-compile:
    name: bench compile (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-14-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Compile benchmarks (no-run)
        run: cargo bench --no-run -p airml-bench

  # ── Binary size monitor (macOS arm64 only) ────────────────────────────────
  binary-size:
    name: binary size monitor (macos-14 arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-14-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release (coreml)
        run: cargo build --workspace --release --features=coreml

      - name: Check binary size
        run: |
          SIZE_BYTES=$(wc -c < target/release/airml | tr -d ' ')
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES/1048576}")
          echo "Binary size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          if [ "$SIZE_BYTES" -gt $((10 * 1024 * 1024)) ]; then
            echo "ERROR: binary exceeds 10 MB limit (${SIZE_MB} MB)"
            exit 1
          fi

  # ── End-to-end integration tests with real ORT (macOS arm64 only) ─────────
  integration:
    name: integration (macos-14)
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install ONNX Runtime
        run: |
          curl -L https://github.com/microsoft/onnxruntime/releases/download/v1.20.0/onnxruntime-osx-arm64-1.20.0.tgz \
            -o /tmp/ort.tgz
          tar -xzf /tmp/ort.tgz -C /tmp/
          echo "ORT_DYLIB_PATH=/tmp/onnxruntime-osx-arm64-1.20.0/lib/libonnxruntime.1.20.0.dylib" >> $GITHUB_ENV

      - name: Run e2e tests
        run: cargo test --test integration_e2e --test integration_hub --test integration_tune --features=coreml,nlp
