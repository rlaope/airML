[package]
name = "airml-hub"
version = "0.1.0"
edition = "2021"
description = "Content-addressed model download and caching for airML (HuggingFace, registry, URL)"
license = "MIT"
repository = "https://github.com/airml/airml"
homepage = "https://github.com/airml/airml"
documentation = "https://docs.rs/airml-hub"
readme = "README.md"
keywords = ["onnx", "huggingface", "cache", "model-hub"]
categories = ["science", "caching"]
rust-version = "1.80"

[dependencies]
ureq = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
proptest = "1.5"
