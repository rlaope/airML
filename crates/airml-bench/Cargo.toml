[package]
name = "airml-bench"
version = "0.1.0"
edition = "2021"
description = "Criterion-based benchmarking harness with realistic synthetic inputs for airML"
license = "MIT"
repository = "https://github.com/airml/airml"
homepage = "https://github.com/airml/airml"
documentation = "https://docs.rs/airml-bench"
readme = "README.md"
keywords = ["onnx", "benchmark", "criterion", "inference"]
categories = ["science", "development-tools"]
rust-version = "1.80"

[features]
default = ["cpu"]
cpu = ["airml-providers/cpu"]
coreml = ["airml-providers/coreml"]

[dependencies]
airml-core = { workspace = true }
airml-providers = { workspace = true }
ndarray = { workspace = true }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"

[[bench]]
name = "inference"
harness = false
