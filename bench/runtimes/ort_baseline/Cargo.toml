[workspace]
resolver = "2"

[package]
name = "airml-bench-ort"
version = "0.1.0"
edition = "2021"
description = "ORT-only baseline for airML cross-runtime benchmarks"
publish = false

[dependencies]
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
ndarray = "0.16"
serde_json = "1"
anyhow = "1"

[features]
coreml = ["ort/coreml"]
