coverage:
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: 70%
        threshold: 5%
  ignore:
    - "tests/"
    - "**/tests/"
    - "examples/"
    - "bench/"
    - "fuzz/"
    - "scripts/"
    - "deploy/"
    - "docker/"
    - "book/"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
